name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          bash -n deploy/install.sh
          bash -n scripts/deploy-giobox.sh
          bash -n scripts/smoke-test.sh
          bash -n scripts/quota-report.sh
          bash -n config/run-copyparty.sh
      - name: Check public repo hygiene
        run: |
          test ! -e .env
          ! git ls-files | grep -E '(^|/)(data|cache|logs|backups)/'
          ! git ls-files | grep -E '(^|/)(\.env|[^/]+\.env|agent-share-box\.env)$'
          ! git ls-files | grep -E '(^|/)(share\.img|.*\.sqlite|.*\.db)$'
