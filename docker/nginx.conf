server {
  listen 3923;
  server_name _;
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;

  auth_basic "Agent Share Box";
  auth_basic_user_file /state/nginx/htpasswd;

  location = / {
    error_page 418 = @copyparty_root;
    if ($request_method !~ ^(GET|HEAD)$) {
      return 418;
    }
    add_header Cache-Control "no-store, max-age=0";
    root /opt/agent-share-box/ui;
    try_files /index.html =404;
  }

  location /asb/ {
    add_header Cache-Control "no-store, max-age=0";
    alias /opt/agent-share-box/ui/;
  }

  location /browse/ {
    proxy_pass http://127.0.0.1:3924/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location / {
    proxy_pass http://127.0.0.1:3924;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location @copyparty_root {
    proxy_pass http://127.0.0.1:3924;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }
}

