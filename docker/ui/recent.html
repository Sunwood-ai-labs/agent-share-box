<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recent - Agent Share Box</title>
  <link rel="stylesheet" href="/asb/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Agent Share Box</p>
      <h1>Recent files</h1>
    </div>
    <nav aria-label="Utilities">
      <a href="/">Files</a>
      <a href="/manage">Manage</a>
    </nav>
  </header>

  <main>
    <section class="status" aria-live="polite">
      <div>
        <span class="label">Scope</span>
        <div>Newest files across the share</div>
      </div>
      <div>
        <span class="label">Storage</span>
        <div id="storage">loading...</div>
      </div>
    </section>

    <section class="browser" aria-label="Recent files">
      <div class="section-head">
        <h2>Files</h2>
        <span id="recent-count" class="count">0</span>
      </div>
      <div id="recent" class="list" data-empty="No recent files"></div>
    </section>
  </main>

  <template id="row-template">
    <a class="row">
      <span class="kind"></span>
      <span class="name"></span>
      <span class="meta recent-time"></span>
    </a>
  </template>

  <script src="/asb/recent.js"></script>
</body>
</html>
