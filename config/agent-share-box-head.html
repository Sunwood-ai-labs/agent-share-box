<style>
:root {
  --asb-bg: #141412;
  --asb-surface: #1b1b18;
  --asb-surface-soft: #20201d;
  --asb-line: rgba(230, 222, 204, 0.14);
  --asb-line-strong: rgba(230, 222, 204, 0.24);
  --asb-text: #ece5d7;
  --asb-muted: #928a78;
  --asb-link: #d9bd73;
  --asb-file: #e5ded0;
  --asb-md: #c9d8cd;
  --asb-focus: #9bc7bd;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--asb-bg);
}

body {
  color: var(--asb-text);
  background: var(--asb-bg) !important;
  font-family: "Avenir Next", "Gill Sans", "Segoe UI", sans-serif;
  letter-spacing: 0;
}

a {
  color: var(--asb-link);
  text-decoration: none;
}

a:hover,
a:focus-visible {
  color: var(--asb-focus);
}

button,
input,
select,
textarea {
  font: inherit;
}

button,
input[type="submit"],
input[type="button"],
a[href="#v=up2k"],
a[href="#v=bup"],
a[href="#v=mkdir"],
a[href="#v=new_md"],
a[href="#v=cfg"],
a[href="#v=msg"] {
  border: 1px solid var(--asb-line-strong) !important;
  border-radius: 4px !important;
  background: transparent !important;
  color: var(--asb-text) !important;
  box-shadow: none !important;
}

button:hover,
input[type="submit"]:hover,
input[type="button"]:hover,
a[href="#v=up2k"]:hover,
a[href="#v=bup"]:hover,
a[href="#v=mkdir"]:hover,
a[href="#v=new_md"]:hover,
a[href="#v=cfg"]:hover,
a[href="#v=msg"]:hover {
  border-color: var(--asb-focus) !important;
  background: rgba(155, 199, 189, 0.08) !important;
}

input,
textarea {
  border: 1px solid var(--asb-line-strong) !important;
  border-radius: 4px !important;
  background: var(--asb-surface) !important;
  color: var(--asb-text) !important;
}

input:focus,
textarea:focus,
button:focus-visible,
a:focus-visible {
  outline: 2px solid rgba(155, 199, 189, 0.55) !important;
  outline-offset: 2px;
}

#ops,
#opctl {
  margin: 0.55rem 1rem 0.8rem !important;
  padding: 0.45rem 0.55rem !important;
  border: 1px solid var(--asb-line) !important;
  border-radius: 4px !important;
  background: var(--asb-surface) !important;
  box-shadow: none !important;
}

#ops a,
#opctl a {
  opacity: 0.82;
}

#ops a:hover,
#opctl a:hover {
  opacity: 1;
}

#tree {

  border-right: 1px solid var(--asb-line) !important;
  background: #11110f !important;
  box-shadow: none !important;
}

#tree a {
  border-radius: 3px;
  padding: 0.06rem 0.18rem;
}

#tree a:hover {
  background: rgba(155, 199, 189, 0.08);
}

#tree .sel,
#tree a.sel,
#tree a[aria-current="page"] {

  color: var(--asb-text) !important;
}

table {
  margin-top: 0.75rem !important;
  border-collapse: collapse !important;
  background: transparent !important;
  border: 1px solid var(--asb-line) !important;
  border-radius: 0 !important;
  box-shadow: none !important;
}

th {

  letter-spacing: 0.04em;
}

td,
th {

  padding: 0.34rem 0.58rem !important;
}

tr:nth-child(even) td {

}

tr:hover td {
  background: rgba(155, 199, 189, 0.055) !important;
}

td a[href$="/"] {
  color: var(--asb-link) !important;
  font-weight: 650;
}

td a[href*=".md"],
td a[href*="?doc="],
td:has(a[href*="?doc="]) {

}

td a:not([href$="/"]):not([href*="?zip"]):not([href*="?doc="]) {

}

#srv_info,
.srv_info,
#srv {

}

h1,
h2,
h3 {

  font-family: "Avenir Next", "Gill Sans", "Segoe UI", sans-serif;
  font-weight: 650;
  letter-spacing: 0;
}

h1::after,
h2::after {

  width: 2rem;
  height: 1px;

}

  #ops,
  #opctl {
    margin-inline: 0.5rem !important;
    overflow-x: auto;
  }

  table {
    width: calc(100vw - 1rem) !important;
    max-width: calc(100vw - 1rem) !important;
    margin-left: 0.5rem !important;
    font-size: 0.84rem;
  }

  td,
  th {
    padding: 0.32rem 0.44rem !important;
  }

  th:nth-child(3),
  td:nth-child(3),
  th:nth-child(4),
  td:nth-child(4),
  th:nth-child(5),
  td:nth-child(5) {
    display: none;
  }
}
